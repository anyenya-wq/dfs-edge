name: DFS Edge tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # The same suite against both backends. SQLite is what a
        # Codespace and this job's default use; PostgreSQL is what a
        # hosted deployment needs, and running the real tests against a
        # real server is the only way that claim stays true.
        backend: [sqlite, postgres]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432


    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The bare console script, deliberately. `python -m pytest` adds
      # the working directory to sys.path and would mask exactly the
      # import problem this workflow exists to catch.
      - name: Run tests
        env:
          DFS_TEST_DATABASE_URL: >-
            ${{ matrix.backend == 'postgres'
                && 'postgresql://postgres:postgres@localhost:5432/postgres'
                || '' }}
        run: pytest -q
