[pytest]
# Puts the project root on sys.path so `from dfs...` resolves.
#
# Without this, `python3 -m pytest` works and bare `pytest` does not,
# because the module form adds the working directory to sys.path and the
# console script does not. Every run during development used the module
# form, so the gap stayed invisible until someone ran the obvious
# command. CI now runs the console script for exactly that reason.
pythonpath = .

testpaths = tests
filterwarnings =
    ignore::DeprecationWarning:pulp.*
